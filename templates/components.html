{% component faction_portrait(title: string, image) %}
<div class="faction-portrait-wrap">
    {% if image %}
    <img
        class="portrait-img"
        src="{{ get_url(path='images/portraits/' ~ image) }}"
        alt="{{ title }} portrait"
    />
    {% else %}
    <div class="faction-portrait-placeholder">{{ title }}</div>
    {% endif %}
</div>
{% endcomponent faction_portrait %}
